[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataworkchallenge-2026"
version = "0.1.0"
description = "DataWorks 2026 reservoir forecasting and validation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.16.3",
  "scikit-learn==1.6.1",
  "matplotlib==3.10.8",
  "joblib==1.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
